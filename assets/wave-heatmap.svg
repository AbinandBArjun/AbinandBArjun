<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#39FF14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:1" />
    </linearGradient>
    <filter id="waveGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes wave {
        0% { transform: translateX(0); }
        100% { transform: translateX(100%); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .wave-line {
        animation: wave 4s linear infinite;
      }
      .pulse-circle {
        animation: pulse 2s ease-in-out infinite;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="#0D1117"/>
  
  <!-- Wave pattern -->
  <path class="wave-line" d="M0,150 Q300,50 600,150 T1200,150" stroke="url(#waveGradient)" stroke-width="3" fill="none" filter="url(#waveGlow)"/>
  <path class="wave-line" d="M0,180 Q300,80 600,180 T1200,180" stroke="url(#waveGradient)" stroke-width="2" fill="none" filter="url(#waveGlow)" opacity="0.6"/>
  <path class="wave-line" d="M0,120 Q300,20 600,120 T1200,120" stroke="url(#waveGradient)" stroke-width="2" fill="none" filter="url(#waveGlow)" opacity="0.4"/>
  
  <!-- Contribution intensity indicators -->
  <circle class="pulse-circle" cx="200" cy="100" r="8" fill="#00E5FF" opacity="0.8"/>
  <circle class="pulse-circle" cx="400" cy="200" r="6" fill="#39FF14" opacity="0.7" style="animation-delay: 0.3s;"/>
  <circle class="pulse-circle" cx="600" cy="80" r="7" fill="#00E5FF" opacity="0.8" style="animation-delay: 0.6s;"/>
  <circle class="pulse-circle" cx="800" cy="220" r="5" fill="#39FF14" opacity="0.6" style="animation-delay: 0.9s;"/>
  <circle class="pulse-circle" cx="1000" cy="150" r="8" fill="#00E5FF" opacity="0.8" style="animation-delay: 1.2s;"/>
</svg>
