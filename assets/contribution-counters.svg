<svg width="100%" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes countUp {
        0% { content: "0"; }
        100% { content: ""; }
      }
      @keyframes slideIn {
        0% { transform: translateY(20px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      .counter-box {
        animation: slideIn 0.6s ease-out forwards;
      }
      .counter-number {
        font-family: 'Courier New', monospace;
        font-weight: bold;
        font-size: 32px;
      }
      .counter-label {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        fill: #00E5FF;
      }
      @keyframes pulse-count {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      .pulse {
        animation: pulse-count 2s ease-in-out infinite;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="150" fill="#0D1117"/>
  
  <!-- Title -->
  <text x="600" y="30" font-family="Fira Code" font-size="18" fill="#39FF14" font-weight="bold" text-anchor="middle">Contribution Statistics</text>
  
  <!-- Counter Box 1: Total Commits -->
  <g class="counter-box" style="animation-delay: 0.1s;">
    <rect x="100" y="50" width="220" height="90" rx="8" fill="#0D2D2D" stroke="#00E5FF" stroke-width="2"/>
    <text class="counter-label" x="210" y="75" text-anchor="middle">Total Commits</text>
    <text class="counter-number pulse" x="210" y="115" text-anchor="middle" fill="#39FF14">1,247</text>
  </g>
  
  <!-- Counter Box 2: Pull Requests -->
  <g class="counter-box" style="animation-delay: 0.2s;">
    <rect x="390" y="50" width="220" height="90" rx="8" fill="#0D2D2D" stroke="#39FF14" stroke-width="2"/>
    <text class="counter-label" x="500" y="75" text-anchor="middle">Pull Requests</text>
    <text class="counter-number pulse" x="500" y="115" text-anchor="middle" fill="#00E5FF" style="animation-delay: 0.3s;">342</text>
  </g>
  
  <!-- Counter Box 3: Code Review -->
  <g class="counter-box" style="animation-delay: 0.3s;">
    <rect x="680" y="50" width="220" height="90" rx="8" fill="#0D2D2D" stroke="#00E5FF" stroke-width="2"/>
    <text class="counter-label" x="790" y="75" text-anchor="middle">Issues Solved</text>
    <text class="counter-number pulse" x="790" y="115" text-anchor="middle" fill="#39FF14" style="animation-delay: 0.6s;">156</text>
  </g>
  
  <!-- Counter Box 4: Repositories -->
  <g class="counter-box" style="animation-delay: 0.4s;">
    <rect x="970" y="50" width="220" height="90" rx="8" fill="#0D2D2D" stroke="#39FF14" stroke-width="2"/>
    <text class="counter-label" x="1080" y="75" text-anchor="middle">Repositories</text>
    <text class="counter-number pulse" x="1080" y="115" text-anchor="middle" fill="#00E5FF" style="animation-delay: 0.9s;">28</text>
  </g>
</svg>
