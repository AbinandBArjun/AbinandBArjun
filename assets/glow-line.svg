<svg width="1200" height="40" viewBox="0 0 1200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGlow" x1="0" x2="1200" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#39FF14"/>
      <stop offset="0.85" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="18" width="1200" height="4" rx="2" fill="url(#lineGlow)" filter="url(#softGlow)"/>
</svg>
